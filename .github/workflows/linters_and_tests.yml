name: Linters and Tests

on:
  push:
    branches:
      - main
      - develop  
    paths-ignore:
      - 'docs/**'
      - 'README.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - '*' # Pull requests to all branches'
    paths-ignore:
      - 'docs/**'
      - 'README.md'

jobs:
  build-and-test:
    # skip draft pull requests, they run once marked ready for review
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        pandas: ["locked"]
        include:
          # pandas 3 is locked for python >= 3.11, also test pandas 2 there
          - os: ubuntu-latest
            python-version: "3.13"
            pandas: "2"
    defaults:
      run:
        shell: bash

    steps:

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - name: setup
        uses: actions/checkout@v4
      
      - name: Install ffmpeg on macOS
        if: runner.os == 'macOS'
        run: |
          brew install ffmpeg

      - name: Install ffmpeg on Ubuntu
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install ffmpeg on Windows
        if: runner.os == 'Windows'
        run: |
          choco install ffmpeg -y --no-progress

      - name: Install poetry
        uses: snok/install-poetry@v1
        with:
          virtualenvs-create: true
          virtualenvs-in-project: true
      
      - name: Load cached venv
        id: cached-pip-wheels
        uses: actions/cache@v3
        with:
          path: ~/.cache
          key: venv-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install packages
        run: poetry install --all-extras --with docs,developing

      - name: Install pandas 2
        if: matrix.pandas == '2'
        run: poetry run python -m pip install "pandas>=2.1,<3.0"

      - name: ruff linting
        run: poetry run ruff format --check tests/ databallpy/

      - name: Set Matplotlib backend
        run: echo "MPLBACKEND=Agg" >> $GITHUB_ENV

      - name: Test with pytest
        run: poetry run python -m pytest tests --pythonwarnings=once --cov-report=term-missing --cov-report=xml --cov=databallpy --cov-config=.coveragerc
